name: release

# 打 tag（例如 v2.0.0）时：打包 .tgz 并附到 GitHub Release，
# 可选地把同一个包发布到 npm（需要仓库 secret NPM_TOKEN）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 校验 package.json 的 dsh.bundle 声明
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.dsh?.bundle?.patch) { console.error('缺少 dsh.bundle.patch，无法通过市场 CI'); process.exit(1); }
            console.log('dsh.bundle.patch =', p.dsh.bundle.patch);
          "

      - name: 打包
        run: npm pack

      - name: 附到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          generate_release_notes: true

      - name: 发布到 npm（没有 NPM_TOKEN 时自动跳过）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "未配置 NPM_TOKEN，跳过 npm 发布";
            exit 0
          fi
          npm publish --access public
